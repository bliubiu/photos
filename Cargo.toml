# 工作区（依赖方向 cli -> api -> core；desktop -> api -> core；infra 供 core 使用）
[workspace]
resolver = "2"
members = [
    "crates/photos-core",
    "crates/photos-api",
    "crates/photos-cli",
    "crates/photos-desktop",
    "crates/photos-infra",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["photos 项目组"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
imageproc = "0.25"
nalgebra = "0.33"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

# 推理：ONNX Runtime（CPU 版；CUDA 需额外配置，见 docs/04-模型清单.md）
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }

# 模型一键下载（纯 Rust HTTP 客户端，无外部 curl 依赖）
ureq = "2"

# M3 服务与桌面：HTTP 服务（Axum）+ 异步运行时 + 静态资源 + 打包下载
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
mime = "0.3"

# 体积与内存优化：发布构建启用 LTO + 精简符号 + panic=abort，从源头减小二进制体积
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

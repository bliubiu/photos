# 内置模型市场清单（随二进制内嵌，离线可用）
#
# 说明：
# - 处理链路本身零联网，「一键下载」只是可选便利；本清单用于 WebUI 展示可获取的模型。
# - 条目默认 `enabled = false` 且 url / sha256 留空：**不随包发布第三方直链与哈希**，
#   避免地址失效或哈希不符导致下载出错误文件。
# - 用户可复制 `data/model_market.toml`（结构与本文件一致），按 `id` + `version` 覆盖条目，
#   补齐真实 url 与 sha256 后把 `enabled` 置为 true，即启用该版本的下载。
# - `version` 即磁盘目录名：下载后落到 `models/<id>/<version>/`，可多版本共存并切换/回滚。


# 智能证件照工具 —— 项目根运行配置（本机已放置模型）
# 字段说明：docs/examples/application.toml、docs/04-模型清单.md
# 参数优先级：命令行 > 环境变量（PHOTOS_*）> 本文件 > 默认值

[general]
data_dir = "data"
log_dir = "logs"
log_level = "INFO"
default_mode = "balanced"
models_dir = "models"

[models.download]
enabled = true
timeout_secs = 300
concurrency = 2

[models.mtcnn_pnet]
path = "models/pnet.onnx"
sha256 = "07a69013008e612c4d2ad31b09645038911dfec67411cd68ccd0da55ca291a35"
download.url = "https://github.com/yiyuezhuo/mtcnn-onnxruntime/blob/main/mtcnn_ort/pnet.onnx"
input_dims = [1, 3, 12, 12]

[models.mtcnn_rnet]
path = "models/rnet.onnx"
sha256 = "de0f837f02b57e1e85959c3ae5c46bcd16162e6e95be5db8794e3c7c85a89004"
download.url = "https://github.com/yiyuezhuo/mtcnn-onnxruntime/blob/main/mtcnn_ort/rnet.onnx"
input_dims = [1, 3, 24, 24]

[models.mtcnn_onet]
path = "models/onet.onnx"
sha256 = "d80f19b44f72e45dd2b7d01384d56994220f60d9417b2a7fbba9041ef1d75e52"
download.url = "https://github.com/yiyuezhuo/mtcnn-onnxruntime/blob/main/mtcnn_ort/onet.onnx"
input_dims = [1, 3, 48, 48]

[models.retinaface]
path = "models/retinaface_r50.onnx"
sha256 = "40f825cf7dd0a88b26fb61db9a3aaedc2cad35162091113f4017b3c26a4f792d"
download.url = "https://github.com/Zeyi-Lin/HivisionIDPhotos/releases/download/pretrained-model/retinaface-resnet50.onnx"
input_dims = [1, 3, 640, 640]

[models.movnet_light]
path = "models/movenet_lightning.onnx"
sha256 = "1ad4f8d6c2f776a9967db3993c9ca740bc350104f9d37c151dc183fc29a464ad"
input_dims = [1, 192, 192, 3]

[models.movnet_thunder]
path = "models/movenet_thunder.onnx"
sha256 = "3dca9f6e5f8a64dc9935a5be06fd8bf81bf01e696c9c05c6f2a650e0a401b763"
input_dims = [1, 256, 256, 3]

[models.rmbg]
path = "models/rmbg-1.4.onnx"
sha256 = "8cafcf770b06757c4eaced21b1a88e57fd2b66de01b8045f35f01535ba742e0f"
input_dims = [1, 3, 1024, 1024]

[models.birefnet_lite]
path = "models/birefnet-lite.onnx"
sha256 = "5600024376f572a557870a5eb0afb1e5961636bef4e1e22132025467d0f03333"
input_dims = [1, 3, 1024, 1024]

[models.birefnet_full]
path = "models/birefnet-full.onnx"
sha256 = "58f621f00f5d756097615970a88a791584600dcf7c45b18a0a6267535a1ebd3c"
input_dims = [1, 3, 1024, 1024]
download.url = "https://github.com/ZhengPeng7/BiRefNet/releases/download/v1/BiRefNet-general-epoch_244.onnx"

[models.modnet]
path = "models/modnet.onnx"
sha256 = "07c308cf0fc7e6e8b2065a12ed7fc07e1de8febb7dc7839d7b7f15dd66584df9"
input_dims = [1, 3, 512, 512]

[models.parsing_lip]
path = "models/parsing_lip.onnx"
sha256 = "8436e1dae96e2601c373d1ace29c8f0978b16357d9038c17a8ba756cca376dbc"
input_dims = [1, 3, 473, 473]

[modes.speed]
face = "mtcnn"
keypoint = "movnet_light"
matting = "rmbg"
execution_provider = "cpu"

[modes.balanced]
face = "retinaface"
keypoint = "movnet_light"
matting = "birefnet_lite"
execution_provider = "cpu"

[modes.quality]
face = "retinaface"
keypoint = "movnet_thunder"
matting = "birefnet_full"
execution_provider = "cuda"


height_mm = 49.0
dpi = 300
width_px = 413
height_px = 579

[sizes.small_one_inch]
name = "小一寸"
width_mm = 22.0
height_mm = 32.0
dpi = 300
width_px = 260
height_px = 378

[backgrounds.white]
name = "白"
rgb = [255, 255, 255]

[backgrounds.blue]
name = "蓝"
rgb = [67, 142, 219]

[backgrounds.red]
name = "红"
